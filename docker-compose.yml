name: trackingext

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked at build time — set VITE_SERVER_URL in Dokploy Environment
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:3000}
    init: true
    expose:
      - "80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    expose:
      - "3000"
    # Dokploy writes UI env vars to .env next to this compose file,
    # but does NOT inject them unless referenced here.
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - ../files/trackingext-db:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
