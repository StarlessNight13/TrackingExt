name: trackingext

# Single public entry (Dokploy/Traefik):
#   Browser  → https://track.staradox.com → Traefik → web:80
#   web/nginx → http://server:3000  (Docker compose network only)
#
# server has NO public domain. Do not add api.* in Dokploy.
#
# Networking:
#   - no ports: / no host network
#   - web joins dokploy-network (Traefik)
#   - server stays on the compose network only (internal)

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Public origin of the dashboard (same-origin calls /api and /rpc via nginx)
        VITE_SERVER_URL: ${VITE_SERVER_URL:-https://track.staradox.com}
    init: true
    expose:
      - "80"
    networks:
      - dokploy-network
      - default
    labels:
      - traefik.docker.network=dokploy-network
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    expose:
      - "3000"
    # Internal only — reachable as http://server:3000 from the web container
    networks:
      - default
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-file:/data/trackingext.db}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://track.staradox.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://track.staradox.com}
      ALLOW_SIGN_UP: ${ALLOW_SIGN_UP:-true}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
    volumes:
      - ../files/trackingext-db:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
  default:
