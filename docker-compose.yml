name: trackingext

# Production shape (single public URL via Dokploy/Traefik):
#   https://track.staradox.com      → web container port 80  (Vite static SPA + nginx)
#   https://track.staradox.com/api  → proxied by nginx to server:3000
#   https://track.staradox.com/rpc  → proxied by nginx to server:3000
#
# Networking rules for Dokploy:
#   - Do NOT use ports: (that publishes to the host)
#   - Do NOT use network_mode: host
#   - Use expose: only (documents container ports on the Docker network)
#   - Join dokploy-network so Traefik can reach the containers
#
# Dokploy Domains:
#   track.staradox.com → service web → port 80  (HTTPS terminates at Traefik)

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Must match the public dashboard origin (baked into JS at build time)
        VITE_SERVER_URL: ${VITE_SERVER_URL:-https://track.staradox.com}
    init: true
    expose:
      - "80"
    networks:
      - dokploy-network
      - default
    # Required when attached to multiple networks, or Traefik may pick the wrong one
    labels:
      - traefik.docker.network=dokploy-network
    depends_on:
      server:
        condition: service_healthy
    # No Docker healthcheck: a failing check makes Traefik return 404 for the domain.
    # Readiness is logged by apps/web/docker-entrypoint.sh instead.
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    expose:
      - "3000"
    networks:
      - dokploy-network
      - default
    labels:
      - traefik.docker.network=dokploy-network
    # Dokploy writes UI env vars to .env next to this compose file,
    # but does NOT inject them unless referenced here.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-file:/data/trackingext.db}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://track.staradox.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://track.staradox.com}
      ALLOW_SIGN_UP: ${ALLOW_SIGN_UP:-true}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
    volumes:
      - ../files/trackingext-db:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
  default:
