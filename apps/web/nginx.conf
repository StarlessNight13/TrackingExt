server {
    # Listen inside the container only. Traefik reaches this via dokploy-network.
    # This is NOT host-network binding.
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Internal Docker DNS: service name "server" on the compose network
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass_header Set-Cookie;
    }

    location /rpc {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass_header Set-Cookie;
    }

    location /api-reference {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Extension package metadata (JSON, not a download attachment)
    location = /downloads/extension-version.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=60";
        try_files $uri =404;
    }

    # Extension packages (must NOT fall through to SPA index.html)
    location /downloads/ {
        types { application/zip zip; }
        default_type application/zip;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # SPA fallback (Vite static build)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
